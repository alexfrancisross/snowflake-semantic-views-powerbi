name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r streamlit/requirements.txt
          pip install -r streamlit/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check streamlit/

      - name: Unit tests (pytest)
        run: pytest streamlit/tests/ -v

  # Integration tests against a live Snowflake account and DAX Studio /
  # Power BI Desktop tests require credentials and a Windows desktop
  # environment respectively - they are not runnable in this hosted CI
  # and must be run locally. See:
  #   - tests/integration/README.md   (Snowflake SQL fixture checks)
  #   - tests/dax-studio/README.md    (DAX Studio query pack, Windows-only)
